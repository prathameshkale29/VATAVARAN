<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="vb-sun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="vb-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="vb-drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="vb-sprout" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="vb-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-opacity="0.32" flood-color="#030712" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#vb-bg)" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Atmospheric Wave Rings (Climate & Air) -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="3 4" />
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Radiant Golden Sun -->
  <circle cx="78" cy="46" r="21" fill="url(#vb-sun)" filter="url(#vb-shadow)" />
  <path d="M78 18 L78 22 M98 26 L95 29 M106 46 L102 46 M98 66 L95 63" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Streamlines (Vata - Wind) -->
  <path d="M20 64 C 36 64, 42 60, 56 60 C 66 60, 72 64, 88 64" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M16 73 C 30 73, 38 69, 50 69 C 64 69, 72 73, 94 73" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Weather Cloud -->
  <path d="M42 86 L84 86 C92.8 86 100 78.8 100 70 C100 61.8 93.9 55.1 86 54.2 C84.8 42.6 74.8 34 63 34 C52.2 34 43 41.2 40.5 51.5 C32.5 52.8 26 59.8 26 68.5 C26 78.1 33.2 86 42 86 Z"
        fill="url(#vb-cloud)"
        filter="url(#vb-shadow)" />

  <!-- Raindrop / Climate Precidion -->
  <path d="M48 94 C48 94 43 102 43 105 C43 107.8 45.2 110 48 110 C50.8 110 53 107.8 53 105 C53 102 48 94 48 94 Z"
        fill="url(#vb-drop)" />

  <!-- Panchayat Agricultural Leaf -->
  <path d="M72 108 C72 99 82 95 86 93 C86 99 81 107 72 108 Z"
        fill="url(#vb-sprout)" />
  <path d="M72 108 C68 102 69 98 71 96" fill="none" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" />
</svg>